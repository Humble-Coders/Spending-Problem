name: iOS

on:
  push:
    branches-ignore:
      - previews
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: NativeProof

jobs:
  preview:
    name: Simulator preview
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Create simulator
        run: |
          runtime=$(xcrun simctl list runtimes available --json \
            | jq -c '[.runtimes[] | select(.platform == "iOS")] | max_by(.version | split(".") | map(tonumber))')
          device_type=$(jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPhone" and (.name | endswith(" Pro")))] | max_by(.name) | .identifier' <<< "$runtime")
          echo "Using $device_type on $(jq -r .name <<< "$runtime")"
          udid=$(xcrun simctl create Preview "$device_type" "$(jq -r .identifier <<< "$runtime")")
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild build \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet

      - name: Capture screenshots
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$app"
          xcrun simctl launch "$UDID" "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          mkdir -p screenshots
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/light.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/dark.png

      - name: Publish screenshots
        working-directory: screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b previews
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of $GITHUB_REF_NAME at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" previews

  testflight:
    name: TestFlight
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
